packages:
  - apps/*
  - "!examples/*"
  - "!.vercel/**"

allowedDeprecatedVersions:
  abab: "*"
  are-we-there-yet: "*"
  domexception: "*"
  gauge: "*"
  glob: "*"
  inflight: "*"
  lodash.isequal: "*"
  npmlog: "*"
  rimraf: "*"
  sourcemap-codec: "*"
  stable: "*"
  w3c-hr-time: "*"

onlyBuiltDependencies:
