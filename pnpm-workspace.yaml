packages:
  - apps/*
  - "!examples/*"
  - "!.vercel/**"

allowedDeprecatedVersions:
  abab: "*"
  are-we-there-yet: "*"
  domexception: "*"
  gauge: "*"
  glob: "*"
  inflight: "*"
  lodash.isequal: "*"
  npmlog: "*"
  rimraf: "*"
  sourcemap-codec: "*"
  stable: "*"
  w3c-hr-time: "*"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@tailwindcss/oxide"
  - core-js
  - core-js-pure
  - es5-ext
  - esbuild
  - less
  - simple-git-hooks
  - typeit
  - vue-demi
  - vue3-danmaku

overrides:
  css-select@^5.2.1: 5.2.0
  drizzle-orm: 0.42.0
  # 本地联调 relizy：保留下一行；无需本地包时删除 relizy 行并执行 pnpm i 重算 lockfile
  relizy: link:../relizy__ruan-cat
