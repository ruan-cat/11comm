name: App 专项 CI

on:
  push:
    paths:
      - "apps/app/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "apps/app/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/app-ci.yml"

jobs:
  app-ci:
    name: App 专项构建与验证
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6

      - name: 安装 pnpm 包管理器
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js 运行时
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 App H5 产物
        run: pnpm -F @01s-11comm/app run build:h5:prod

      - name: 检查 App 类型
        run: pnpm -F @01s-11comm/app run type-check

      - name: 运行 App 单元测试
        run: pnpm -F @01s-11comm/app exec vitest run

      - name: 验证 App API runtime 策略
        run: pnpm -F @01s-11comm/app exec vitest run src/tests/nitro-runtime/runtime-base-url.test.ts

      - name: 构建 App Nitro Vercel 产物
        run: pnpm -F @01s-11comm/app run build:nitro:vercel
