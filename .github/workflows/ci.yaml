name: 全量 Turbo CI

env:
  # https://turborepo.com/docs/crafting-your-repository/constructing-ci#enabling-remote-caching
  # https://vercel.com/docs/monorepos/remote-caching#use-remote-caching-from-external-ci/cd
  TURBO_TOKEN: ${{ secrets.vercel_token }}
  TURBO_TEAM: "ruancat-projects"

on:
  push:
    branches:
      - dev

jobs:
  turbo-ci:
    name: 全量 Turbo 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 pnpm 包管理器
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js 运行时
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 输出本地工具版本
        run: |
          node -v
          pnpm -v
          pnpm exec turbo info

      - name: 登录 Turbo 远程缓存
        if: ${{ env.TURBO_TOKEN != '' }}
        run: pnpm exec turbo login --token=${{ env.TURBO_TOKEN }} --team=${{ env.TURBO_TEAM }}

      - name: 关联 Turbo 远程缓存项目
        if: ${{ env.TURBO_TOKEN != '' }}
        run: pnpm exec turbo link --token=${{ env.TURBO_TOKEN }} --scope=${{ env.TURBO_TEAM }} --yes

      - name: 运行全量 Turbo CI
        run: pnpm run ci

      - name: 验证 API Phase3 基础设施
        run: pnpm -F @01s-11comm/api run verify:phase3

      - name: 扫描禁止的 API 模式
        run: |
          ! rg -n "from ['\"]h3['\"]" apps/api
          ! rg -n "@neondatabase/auth|JWT|jwt|Neon Auth|Token 验证|token 验证|Bearer|Authorization" apps/api/server apps/api/tests
          ! rg -n "pgTable|createInsertSchema|createSelectSchema" apps/api/server apps/api/tests
