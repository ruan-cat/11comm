name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "@*/v*" # 支持 @scope/package@v1.0.0 格式
      - "@*/*@*" # 支持 relizy 生成的 @scope/package@version 格式，如 @01s-11comm/admin@6.1.2

permissions: write-all

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 该工作流要求我们必传 pnpm-lock.yaml 否则初始化失败
      # - name: 设置javascript环境
      #   uses: sxzz/workflows/setup-js@v1
      #   with:
      #     fetch-all: false
      #     package-manager: pnpm
      #     auto-install: true

      - name: 检出分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - recursive: true
            - args: [--global, "npm"]

      - name: 安装node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: corepack手动再安装一次pnpm
        run: corepack enable && corepack install

      # 目前对于该项目来说 是不需要构建发布东西的
      # - name: Build
      #   run: pnpm run build

      - name: 用 changelogithub 生成 github release 发行版日志
        run: pnpm dlx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 对于 changelogithub 来说，生成的日志文件不美观，且云端没有更好的方式实现git文件提交操作 故不使用
      # - name: 用 changelogithub 生成 CHANGELOG 文件日志
      #   run: pnpm dlx changelogithub --output "CHANGELOG.md"
      #   continue-on-error: true
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
