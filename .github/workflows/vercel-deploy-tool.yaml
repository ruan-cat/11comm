# 参考资料
# https://vercel.com/guides/how-can-i-use-github-actions-with-vercel
# https://vercel.com/guides/how-to-alias-a-preview-deployment-using-the-cli

name: 自写的vercel部署工具
env:
  VERCEL_TOKEN: ${{ secrets.vercel_token }}
  # 根据 vercel-deploy-tool 部署配置来决定是否需要以下环境变量
  # VERCEL_ORG_ID: ${{ secrets.vercel_orgId }}
  # VERCEL_PROJECT_ID: ${{ secrets.vercel_projectId }}

  # https://turborepo.com/docs/crafting-your-repository/constructing-ci#enabling-remote-caching
  # https://vercel.com/docs/monorepos/remote-caching#use-remote-caching-from-external-ci/cd
  TURBO_TOKEN: ${{ secrets.vercel_token }}
  TURBO_TEAM: "ruancat-projects"

on:
  push:
    branches:
      - main

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 pnpm 包管理器
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js 运行时
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装工作区依赖
        run: pnpm install --frozen-lockfile

      - name: 检查本地工具版本
        run: |
          node -v
          pnpm -v
          pnpm exec vercel --version
          pnpm exec turbo info

      - name: 登录 Turbo 远程缓存
        run: pnpm exec turbo login --token=${{ env.TURBO_TOKEN }} --team=${{ env.TURBO_TEAM }}

      - name: 关联 Turbo 远程缓存项目
        run: pnpm exec turbo link --token=${{ env.TURBO_TOKEN }} --scope=${{ env.TURBO_TEAM }} --yes

      - name: 运行自写的vercel部署工具
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            pnpm run deploy --diff-base ${{ github.event.before }}
          else
            pnpm run deploy
          fi
